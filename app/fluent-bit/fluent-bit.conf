[SERVICE]
    Flush         0.1
    Parsers_File  /fluent-bit/etc/kong-parsers.conf

[INPUT]
    Name              tail
    Path              /logs/kong/access.json
    Parser            kong_json
    DB                /fluent-bit/state/kong.db
    Refresh_Interval  1
    Read_from_Head    false

[OUTPUT]
    Name            tcp
    Match           *
    Host            192.168.0.40
    Port            5170
    Format          json_lines
    json_date_key   falsesss
    tls             On
    tls.verify      On
    tls.ca_file     /certs/ca.crt
    tls.crt_file    /certs/client.crt
    tls.key_file    /certs/client.key