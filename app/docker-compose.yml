x-api-env: &api-env
  DATABASE_URL: postgres://bola:bola_dev_pw@postgres:5432/bola
  JWT_PUBLIC_KEY_PATH: /keys/public.pem

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bola
      POSTGRES_USER: bola
      POSTGRES_PASSWORD: bola_dev_pw
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"      # DBeaver 등으로 확인할 때만 사용
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bola -d bola"]
      interval: 5s
      retries: 10
    networks: [data-net]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "redis6379"]
    ports:
      - "127.0.0.1:6379:6379"
      - "192.168.0.39:6379:6379" # 탐지 엔진이 있는 pc ip
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis6379", "--no-auth-warning", "ping"]
      interval: 5s
      retries: 10
    networks: [data-net]

  auth:
    build: ./services/auth
    image: bola-auth:dev
    environment:
      DATABASE_URL: postgres://bola:bola_dev_pw@postgres:5432/bola
      JWT_PRIVATE_KEY_PATH: /keys/private.pem
      SERVICE_NAME: auth
      LOG_DIR: /logs/auth
    volumes:
      - ./keys/private.pem:/keys/private.pem:ro
      - ./logs/auth:/logs/auth
    depends_on:
      postgres: { condition: service_healthy }
    networks: [gateway-net, data-net]
    # ports 없음 → 반드시 Kong을 거쳐서만 접근

  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_UNTRUSTED_LUA: "on"           # 5단계 Lua에서 require 사용 (개발용 설정)
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_TRUSTED_IPS: "0.0.0.0/0,::/0"     # NGINX가 넘긴 X-Forwarded-For를 신뢰
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "on"
      KONG_DNS_ORDER: "LAST,A,CNAME"     # SRV 조회 안 함 (폐쇄망에서 6초 시간 초과 방지)
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
      - kong-logs:/logs/kong
    depends_on: [auth, redis]
    networks: [gateway-net, data-net, dmz-net]    # data-net은 5단계 Redis 조회용

  wazuh-agent:
    build: ./wazuh-agent
    hostname: kong-wazuh-agent                       # Wazuh 대시보드에 보일 에이전트 이름
    environment:
      WAZUH_MANAGER: "192.168.0.26"
    volumes:
      - kong-logs:/logs/kong:ro              # 같은 볼륨을 읽기 전용으로
    depends_on: [kong]
    restart: unless-stopped

  fluent-bit:
    image: fluent/fluent-bit:3.2
    volumes:
      - kong-logs:/logs/kong:ro                                          # Kong 로그를 읽기 전용으로
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/kong-parsers.conf:ro
      - fluentbit-state:/fluent-bit/state                                # 읽은 위치(DB) 보관
      - ./fluent-bit/certs:/certs:ro
    restart: unless-stopped

  members:
    build: ./services/members
    image: bola-members:dev
    environment:
      <<: *api-env
      SERVICE_NAME: members
      LOG_DIR: /logs/members
      BOLA_VULNERABLE: "true"          #취약
    volumes:
      - ./keys/public.pem:/keys/public.pem:ro
      - ./logs/members:/logs/members
    depends_on:
      postgres: { condition: service_healthy }
    networks: [gateway-net, data-net]

  profiles:
    build: ./services/profiles
    image: bola-profiles:dev
    environment:
      <<: *api-env
      SERVICE_NAME: profiles
      LOG_DIR: /logs/profiles
      BOLA_VULNERABLE: "false"
    volumes:
      - ./keys/public.pem:/keys/public.pem:ro
      - ./logs/profiles:/logs/profiles
    depends_on:
      postgres: { condition: service_healthy }
    networks: [gateway-net, data-net]

  orders:
    build: ./services/orders
    image: bola-orders:dev
    environment:
      <<: *api-env
      SERVICE_NAME: orders
      LOG_DIR: /logs/orders
      BOLA_VULNERABLE: "true"          #취약
    volumes:
      - ./keys/public.pem:/keys/public.pem:ro
      - ./logs/orders:/logs/orders
    depends_on:
      postgres: { condition: service_healthy }
    networks: [gateway-net, data-net]

  payments:
    build: ./services/payments
    image: bola-payments:dev
    environment:
      <<: *api-env
      SERVICE_NAME: payments
      LOG_DIR: /logs/payments
      BOLA_VULNERABLE: "false"
    volumes:
      - ./keys/public.pem:/keys/public.pem:ro
      - ./logs/payments:/logs/payments
    depends_on:
      postgres: { condition: service_healthy }
    networks: [gateway-net, data-net]

  catalog:
    build: ./services/catalog
    image: bola-catalog:dev
    environment:
      <<: *api-env
      SERVICE_NAME: catalog
      LOG_DIR: /logs/catalog
      BOLA_VULNERABLE: "false"
    volumes:
      - ./keys/public.pem:/keys/public.pem:ro
      - ./logs/catalog:/logs/catalog
    depends_on:
      postgres: { condition: service_healthy }
    networks: [gateway-net, data-net]

  cart:
    build: ./services/cart
    image: bola-cart:dev
    environment:
      <<: *api-env
      SERVICE_NAME: cart
      LOG_DIR: /logs/cart
      BOLA_VULNERABLE: "false"
    volumes:
      - ./keys/public.pem:/keys/public.pem:ro
      - ./logs/cart:/logs/cart
    depends_on:
      postgres: { condition: service_healthy }
    networks: [gateway-net, data-net]

  # ===================== DMZ ZONE: NGINX + ModSecurity(OWASP CRS) WAF =====================
  # 사용자 요청을 받는 유일한 입구: TLS 종료 · WAF 검사 · 메인페이지 · /api → Kong
  waf-log-init:
    image: busybox:1.36
    command: ["sh", "-c", "chown -R 101:101 /var/log/waf"]   # WAF가 uid 101로 로그를 쓸 수 있게
    network_mode: none
    volumes:
      - waf-logs:/var/log/waf
      - ./nginx/certs:/etc/nginx/conf/custom:ro

  waf:
    image: owasp/modsecurity-crs:4.25-nginx-lts
    container_name: nginx-waf
    restart: unless-stopped
    ports:
      - "80:8080"                 # 외부 입구는 WAF만 (컨테이너 안은 8080/8443)
      - "443:8443"
    environment:
      BACKEND: http://kong:8000
      PORT: "8080"
      SSL_PORT: "8443"
      SERVER_NAME: localhost
      WAF_HTTPS_PORT: "443"       # HTTP→HTTPS 이동할 때 쓰는 포트
      SSL_CERT_FILE: /etc/nginx/conf/custom/server.crt
      SSL_CERT_KEY_FILE: /etc/nginx/conf/custom/server.key
      MODSEC_RULE_ENGINE: "On"
      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_AUDIT_LOG_FORMAT: JSON
      BLOCKING_PARANOIA: "1"
      DETECTION_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ALLOWED_METHODS: "GET HEAD POST OPTIONS PUT PATCH DELETE"   # 주문 수정·취소 허용
      # Wazuh Agent가 읽을 수 있도록 로그를 공유 볼륨에 파일로 남김
      MODSEC_AUDIT_LOG: /var/log/waf/modsec_audit.json
      ACCESSLOG: /var/log/waf/access.log
      ERRORLOG: /var/log/waf/error.log
    volumes:
      - waf-logs:/var/log/waf
      - ./nginx-waf/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/conf/custom:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      waf-log-init:
        condition: service_completed_successfully
      kong:
        condition: service_started
    networks: [dmz-net]           # Kong과 같은 망 → kong:8000

volumes:
  pgdata:
  kong-logs:
  fluentbit-state:
  waf-logs:

networks:
  gateway-net:   # Kong ↔ API 서버
  data-net:      # API 서버 · Kong ↔ DB · Redis
  dmz-net:       # NGINX ↔ Kong