# 판단 서버 실행 설정
# 사용법 (judge-server 폴더에서): docker compose up -d --build / 로그 보기: docker compose logs -f / 멈춤: docker compose down
# 전제: bola-rule이 ../bola-rule/output 에 violations-YYYY-MM-DD.jsonl을 쓰고 있음 (도커든 로컬이든 상관없음)
services:
  judge-server:
    build: .
    image: judge-server:latest
    container_name: judge-server
    restart: unless-stopped
    command: ["python", "judge.py", "--watch", "1"]
    volumes:
      # 탐지 엔진의 위반 기록은 읽기만 함
      - ../bola-rule/output:/app/bola-rule/output:ro
      # 룰별 점수 설정은 다시 빌드하지 않고 바꿀 수 있게 붙임
      - ./config.json:/app/judge-server/config.json:ro
      # 점수 결과는 로컬 judge-server/output에 쌓임
      - ./output:/app/judge-server/output
