# DMZ ZONE: NGINX + ModSecurity(OWASP CRS) WAF
# 사용자 요청을 받아 TLS 종료 · WAF 검사 후 API Gateway(Kong)로 전달한다.
#
# 실행 순서
#   1) 이 compose를 먼저 up  → bola-dmz / bola-gateway 네트워크, waf-logs 볼륨 생성
#   2) Gateway(Kong), Wazuh Agent compose를 up (위 네트워크·볼륨을 external 로 사용)
#   3) docker compose restart waf  (Kong이 늦게 떴다면)
#
# Kong 없이 단독 테스트
#   $env:WAF_BACKEND="http://test-backend:80"; docker compose --profile test up -d
#
# 설정값은 .env.example 참고 (.env 로 복사해서 수정)

services:
  # WAF 컨테이너는 nginx(uid 101) 사용자로 실행되므로, 공유 로그 볼륨의 소유자를 미리 맞춰준다.
  log-init:
    image: busybox:1.36
    command: ["sh", "-c", "chown -R 101:101 /var/log/waf"]
    network_mode: none
    volumes:
      - waf-logs:/var/log/waf

  waf:
    image: owasp/modsecurity-crs:4.25-nginx-lts
    container_name: nginx-waf
    restart: unless-stopped
    ports:
      - "${WAF_BIND:-127.0.0.1}:${WAF_HTTP_PORT:-8080}:8080"    # HTTP
      - "${WAF_BIND:-127.0.0.1}:${WAF_HTTPS_PORT:-8443}:8443"   # HTTPS (TLS 종료)
    environment:
      BACKEND: "${WAF_BACKEND:-http://kong:8000}"
      PORT: "8080"
      SSL_PORT: "8443"
      SERVER_NAME: "${WAF_SERVER_NAME:-localhost}"
      # 인증서를 마운트하지 않으면 컨테이너가 시작할 때 자체 서명 인증서를 생성한다.
      # 정식 인증서를 쓰려면 ./certs 를 /etc/nginx/conf/custom 에 마운트하고 아래 경로를 바꾼다.
      # SSL_CERT_FILE: "/etc/nginx/conf/custom/server.crt"
      # SSL_CERT_KEY_FILE: "/etc/nginx/conf/custom/server.key"

      MODSEC_RULE_ENGINE: "On"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      MODSEC_AUDIT_LOG_FORMAT: "JSON"
      BLOCKING_PARANOIA: "${WAF_PARANOIA:-1}"
      DETECTION_PARANOIA: "${WAF_PARANOIA:-1}"
      ANOMALY_INBOUND: "${WAF_ANOMALY_INBOUND:-5}"

      # Wazuh Agent가 읽을 수 있도록 로그를 공유 볼륨에 파일로 남긴다.
      MODSEC_AUDIT_LOG: "/var/log/waf/modsec_audit.json"
      ACCESSLOG: "/var/log/waf/access.log"
      ERRORLOG: "/var/log/waf/error.log"
    volumes:
      - waf-logs:/var/log/waf
    depends_on:
      log-init:
        condition: service_completed_successfully
      test-backend:
        condition: service_started
        required: false   # --profile test 일 때만 사용
    networks:
      - dmz-network
      - gateway-network

  # Kong 없이 단독 테스트할 때만 쓰는 임시 백엔드 (--profile test)
  test-backend:
    image: nginx:alpine
    container_name: test-backend
    profiles: ["test"]
    networks:
      - gateway-network

networks:
  # 사용자 → WAF 구간
  dmz-network:
    name: bola-dmz
    driver: bridge
  # WAF → Kong 구간. Gateway 팀 compose에서는 external: true 로 이 네트워크에 붙는다.
  gateway-network:
    name: bola-gateway
    driver: bridge

volumes:
  # Wazuh Agent compose에서 external: true 로 마운트해 로그를 읽는다.
  waf-logs:
    name: waf-logs
